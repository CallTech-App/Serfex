name: Feature request
description: Suggest something Serfex should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How would you like it to work? If another panel does it well, say which and how.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
