name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for the beta channel)
# builds the release archives and publishes them as a GitHub Release.
# Installed servers find it with their daily check (or "Şimdi denetle")
# under Araçlar ve Ayarlar → Güncellemeler.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Check the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          [[ $v =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$GITHUB_REF_NAME is not a version tag (v1.2.3 or v1.2.3-beta.1)"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Agent tests
        working-directory: agent
        run: go test ./...

      - name: Build the release
        run: scripts/build-release.sh "$VERSION" dist

      # Release notes: release-notes/<version>.md when there is one,
      # otherwise GitHub's list of the merged pull requests.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Servik $VERSION" --verify-tag)
          [[ $VERSION == *-* ]] && args+=(--prerelease) || args+=(--latest)
          if [ -f "release-notes/$VERSION.md" ]; then
            args+=(--notes-file "release-notes/$VERSION.md")
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
