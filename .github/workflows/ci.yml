name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test -race ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/servik-agent ./cmd/servik-agent

  agent-realhost:
    name: Agent on real Nginx and PHP-FPM
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx and PHP-FPM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx php8.3-fpm

      # Creates a real system user, vhost and pool, serves PHP through them,
      # then removes everything again.
      - name: Provision a site for real
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -tags realhost -run TestRealHost -v ./internal/site

  agent-dns:
    name: Agent on real PowerDNS
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      # dns.setup installs PowerDNS itself, frees port 53 from
      # systemd-resolved and starts pdns@servik; the test then checks the
      # answers with dig.
      - name: Set up PowerDNS and serve a zone for real
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -tags realhost -run TestRealHost -v ./internal/dns

  agent-ssl:
    name: Agent issues certificates with Pebble
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx, PHP-FPM and dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx php8.3-fpm dnsutils

      # Pebble is Let's Encrypt's ACME test server. It resolves names
      # through the PowerDNS that the test sets up and validates HTTP-01 on
      # port 80, like Let's Encrypt does.
      - name: Start Pebble
        working-directory: ${{ runner.temp }}
        run: |
          git clone -q --depth 1 --branch v2.9.0 https://github.com/letsencrypt/pebble
          cd pebble
          go build -o pebble ./cmd/pebble
          jq '.pebble.httpPort = 80' test/config/pebble-config.json > servik.json
          PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 nohup ./pebble -config servik.json -dnsserver 127.0.0.1:53 > pebble.log 2>&1 &
          for i in $(seq 30); do curl -sk https://localhost:14000/dir > /dev/null && exit 0; sleep 1; done
          cat pebble.log; exit 1

      # Sets up PowerDNS and a site, then obtains certificates with HTTP-01
      # through Nginx and with DNS-01 (wildcard) through PowerDNS, serves
      # HTTPS, renews and removes them.
      - name: Obtain and serve certificates for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          SERVIK_ACME_DIRECTORY=https://localhost:14000/dir
          "SERVIK_ACME_CA=$RUNNER_TEMP/pebble/test/certs/pebble.minica.pem"
          go test -tags realhost -run TestRealHost -v ./internal/cert

      - name: Pebble log
        if: failure()
        run: cat "$RUNNER_TEMP/pebble/pebble.log"

  panel:
    name: Panel (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servik
          POSTGRES_PASSWORD: servik
          POSTGRES_DB: servik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: panel
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: servik
      DB_PASSWORD: servik
      SERVIK_AGENT_BIN: ${{ github.workspace }}/agent/bin/servik-agent
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Build agent for integration tests
        working-directory: agent
        run: CGO_ENABLED=0 go build -o bin/servik-agent ./cmd/servik-agent

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test
