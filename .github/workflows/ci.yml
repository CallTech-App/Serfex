name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test -race ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/servik-agent ./cmd/servik-agent

  agent-realhost:
    name: Agent on real Nginx and PHP-FPM
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx and PHP-FPM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx php8.3-fpm

      # Creates a real system user, vhost and pool, serves PHP through them,
      # then removes everything again.
      - name: Provision a site for real
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -tags realhost -run TestRealHost -v ./internal/site

  agent-dns:
    name: Agent on real PowerDNS
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      # dns.setup installs PowerDNS itself, frees port 53 from
      # systemd-resolved and starts pdns@servik; the test then checks the
      # answers with dig.
      - name: Set up PowerDNS and serve a zone for real
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -tags realhost -run TestRealHost -v ./internal/dns

  agent-ssl:
    name: Agent issues certificates with Pebble
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx, PHP-FPM and dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx php8.3-fpm dnsutils

      # Pebble is Let's Encrypt's ACME test server. It resolves names
      # through the PowerDNS that the test sets up and validates HTTP-01 on
      # port 80, like Let's Encrypt does.
      - name: Start Pebble
        working-directory: ${{ runner.temp }}
        run: |
          git clone -q --depth 1 --branch v2.9.0 https://github.com/letsencrypt/pebble
          cd pebble
          go build -o pebble ./cmd/pebble
          jq '.pebble.httpPort = 80' test/config/pebble-config.json > servik.json
          PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 nohup ./pebble -config servik.json -dnsserver 127.0.0.1:53 > pebble.log 2>&1 &
          for i in $(seq 30); do curl -sk https://localhost:14000/dir > /dev/null && exit 0; sleep 1; done
          cat pebble.log; exit 1

      # Sets up PowerDNS and a site, then obtains certificates with HTTP-01
      # through Nginx and with DNS-01 (wildcard) through PowerDNS, serves
      # HTTPS, renews and removes them.
      - name: Obtain and serve certificates for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          SERVIK_ACME_DIRECTORY=https://localhost:14000/dir
          "SERVIK_ACME_CA=$RUNNER_TEMP/pebble/test/certs/pebble.minica.pem"
          go test -tags realhost -run TestRealHost -v ./internal/cert

      - name: Pebble log
        if: failure()
        run: cat "$RUNNER_TEMP/pebble/pebble.log"

  agent-mail:
    name: Agent runs a real mail server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      # The agent installs Postfix, Dovecot, Rspamd, Redis and Roundcube
      # itself; the test needs Nginx and PHP-FPM for webmail and dkimpy to
      # verify signatures.
      - name: Install Nginx, PHP-FPM and dkimpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm python3-dkim
          sudo systemctl start nginx php8.3-fpm

      # Sets up the mail server, creates mailboxes and a forwarder, sends
      # through SMTP, reads through IMAP, verifies DKIM, the sender check,
      # the hourly limit, an autoreply and the webmail sign-in.
      - name: Send and receive mail for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 10m ./internal/mail

      - name: Mail log
        if: failure()
        run: sudo journalctl --no-pager -u postfix@- -u dovecot -u rspamd -u redis-server@servik-mail -n 300

  agent-laravel:
    name: Agent installs and deploys Laravel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      # The agent downloads Composer and Node.js itself; the runner only
      # needs Nginx, PHP-FPM and the extensions Laravel uses.
      - name: Install Nginx and PHP-FPM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-sqlite3 php8.3-bcmath php8.3-intl git unzip
          sudo systemctl start nginx php8.3-fpm

      # Creates a new Laravel project with a frontend build, serves it,
      # deploys a broken release that the health check rolls back, keeps
      # state in a Tinker session, backs up and restores storage, .env and
      # the database, starts queue workers, the scheduler and a long-running
      # process behind Nginx, then removes everything again.
      - name: Install and deploy a Laravel app for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 25m ./internal/laravel

      - name: Laravel logs
        if: failure()
        run: |
          sudo journalctl --no-pager -u 'servik-queue-*' -u 'servik-schedule-*' -u 'servik-proc-*' -n 200 || true
          sudo sh -c 'tail -n 100 /var/lib/servik/laravel/*/runs/*.log' || true
          sudo sh -c 'tail -n 50 /var/log/servik/laravel/*/proc-*.log' || true
          sudo sh -c 'cat /etc/nginx/sites-enabled/*' || true

  agent-monitor:
    name: Agent monitors, blocks and limits a real site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx, PHP-FPM and nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm nftables
          sudo systemctl start nginx php8.3-fpm

      # Serves a site, measures a busy PHP request, detects a request flood,
      # blocks the flooding address with nftables, caps the site's CPU and
      # memory through a systemd scope, limits its PHP workers and restarts
      # its pool.
      - name: Monitor and intervene on a real site
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 10m ./internal/monitor

      - name: Logs
        if: failure()
        run: |
          sudo journalctl --no-pager -u php8.3-fpm -u 'servik-limit-*' -n 100 || true
          sudo nft list ruleset || true
          sudo sh -c 'tail -n 30 /var/log/servik/sites/*/*.log' || true

  agent-databases:
    name: Agent runs a real ${{ matrix.product }} server
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [mysql, mariadb, postgresql]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      # The runner image ships MySQL and PostgreSQL with its own settings;
      # the agent installs the server itself, as on a fresh Ubuntu.
      - name: Remove the preinstalled database servers
        run: |
          sudo systemctl stop mysql postgresql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq 'mysql-*' 'mariadb-*' 'postgresql*' || true
          sudo rm -rf /var/lib/mysql /etc/mysql /var/log/mysql /var/lib/postgresql /etc/postgresql
          sudo apt-get update -qq

      # Installs the server, creates databases and users with each access
      # level, connects with them, turns remote access on and off, signs in
      # to phpMyAdmin or Adminer through servik-web and deletes a database
      # with a backup.
      - name: Databases, users and the web manager for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          SERVIK_DB_PRODUCT=${{ matrix.product }}
          go test -tags realhost -run TestRealHost -v -timeout 15m ./internal/database

      - name: Logs
        if: failure()
        run: |
          sudo journalctl --no-pager -u mysql -u mariadb -u 'postgresql*' -u servik-web -u servik-php -n 100 || true
          sudo sh -c 'tail -n 30 /var/log/servik/web/*.log' || true

  agent-components:
    name: Agent installs software for real
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      # The runner image ships Apache with its own settings; the agent
      # installs it itself, as on a fresh Ubuntu.
      - name: Install Nginx and PHP-FPM, remove preinstalled software
        run: |
          sudo systemctl stop apache2 memcached redis-server || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq 'apache2*' memcached 'redis-*' || true
          sudo rm -rf /etc/apache2 /var/lib/apache2
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm
          sudo systemctl start nginx php8.3-fpm

      # Installs Apache and serves a site through Nginx -> Apache with a
      # .htaccess rewrite, refuses to remove Apache while the site uses
      # it, removes it with a backup, rolls back an install that fails
      # (Memcached) and runs a site's own Redis instance.
      - name: Install, use and remove components for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 20m ./internal/component

      - name: Logs
        if: failure()
        run: |
          sudo sh -c 'tail -n 80 /var/lib/servik/components/runs/*.log' || true
          sudo journalctl --no-pager -u apache2 -u nginx -u 'servik-redis-*' -u memcached -n 100 || true

  agent-files:
    name: Agent manages files and SFTP accounts for real
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx, PHP-FPM and OpenSSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm openssh-server curl
          sudo systemctl start nginx php8.3-fpm ssh

      # Uploads, edits, deletes and restores files through the file
      # manager's helper (running as the site's user) and checks that PHP
      # serves them; then signs in over SFTP with curl: chrooted to the
      # site's folder, uploads owned by the site's user, a locked
      # (suspended) account refused, password change, folder change and
      # deletion without touching the site's files.
      - name: Files and SFTP for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 10m ./internal/ftp

      - name: Logs
        if: failure()
        run: |
          sudo journalctl --no-pager -u ssh -u 'var-lib-servik-sftp-*' -n 100 || true
          sudo cat /etc/ssh/sshd_config.d/50-servik-sftp.conf || true
          findmnt -R /var/lib/servik/sftp || true

  agent-security:
    name: Agent secures a real site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx, PHP-FPM, OpenSSH and nftables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm openssh-server nftables curl
          sudo systemctl start nginx php8.3-fpm ssh

      # Installs ModSecurity with the OWASP Core Rule Set through
      # Yazılım Yönetimi, sends an SQL injection and sees it logged
      # (detect), refused with 403 (block), let through under an excluded
      # path and ignored (off); protects a folder with a password; plants
      # a web shell, a world-writable .env, a served backup and a
      # root-owned file, scans, blocks the backup's URL, quarantines the
      # shell and restores it from the file manager's trash, fixes the
      # permissions and the owner; turns the port filter on and checks
      # it from another network namespace; hardens SSH; installs
      # Fail2ban and bans an address after ten failed panel logins.
      - name: WAF, scan, port filter, SSH and Fail2ban for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags realhost -run TestRealHost -v -timeout 15m ./internal/security

      - name: Logs
        if: failure()
        run: |
          sudo tail -n 20 /var/log/servik/modsecurity/audit.log || true
          sudo ls -la /etc/servik/nginx/sites/*/ || true
          sudo nft list ruleset || true
          sudo journalctl --no-pager -u nginx -u fail2ban -n 100 || true
          sudo tail -n 50 /var/log/fail2ban.log || true

  agent-backups:
    name: Agent backs up and restores a real site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      # The agent installs MySQL itself, as on a fresh Ubuntu.
      - name: Install Nginx, PHP-FPM and sshd, remove the preinstalled database servers
        run: |
          sudo systemctl stop mysql postgresql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq 'mysql-*' 'mariadb-*' || true
          sudo rm -rf /var/lib/mysql /etc/mysql /var/log/mysql
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm openssh-server
          sudo systemctl start nginx php8.3-fpm ssh

      # MinIO no longer ships images or binaries (Docker Hub denies the
      # pull, dl.min.io answers 410); moto's S3 server stands in. It
      # speaks the same signed, path-style S3 API the agent uses.
      - name: Start S3-compatible storage
        run: |
          pipx install -q 'moto[server]'
          nohup moto_server -H 127.0.0.1 -p 9000 > /tmp/s3.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9000/moto-api/ && exit 0; sleep 1; done
          cat /tmp/s3.log; exit 1

      # Backs a site (files, home, a MySQL database and a mailbox) up to
      # local disk, to S3 (moto) and to SFTP on this machine, destroys the
      # site and restores it from each, then checks the content.
      - name: Back up, destroy and restore a site for real
        run: >-
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          SERVIK_S3_ENDPOINT=http://127.0.0.1:9000 SERVIK_S3_ACCESS_KEY=servik SERVIK_S3_SECRET_KEY=servik-s3-secret
          go test -tags realhost -run TestRealHost -v -timeout 20m ./internal/backup

      - name: Logs
        if: failure()
        run: |
          sudo sh -c 'tail -n 80 /var/lib/servik/backups/runs/*.log' || true
          sudo journalctl --no-pager -u mysql -u ssh -n 80 || true
          cat /tmp/s3.log || true

  update-realhost:
    name: Panel updates itself on a real server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json

      # Three test releases of this checkout: a good one, one with a new
      # migration, one whose panel answers 500 (see the script).
      - name: Build test releases
        run: scripts/ci/update-e2e.sh build "$RUNNER_TEMP/releases"

      # install.sh sets up the panel's own PostgreSQL and PHP 8.5, as on a
      # fresh Ubuntu.
      - name: Remove the preinstalled database servers
        run: |
          sudo systemctl stop mysql postgresql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq 'mysql-*' 'mariadb-*' 'postgresql*' || true
          sudo rm -rf /var/lib/mysql /etc/mysql /var/lib/postgresql /etc/postgresql /etc/postgresql-common

      # Installs 0.1.0-ci.1 with install.sh, updates to ci.2 after a panel
      # backup, tries ci.3 (fails its health check: Servik returns to ci.2
      # by itself, database included), then returns to ci.1 by hand.
      - name: Install, update, fail and roll back for real
        run: sudo scripts/ci/update-e2e.sh run "$RUNNER_TEMP/releases"

      - name: Logs
        if: failure()
        run: |
          sudo tail -n 60 /var/log/servik/install.log || true
          sudo sh -c 'tail -n 120 /var/lib/servik/updates/runs/*.log' || true
          sudo sh -c 'tail -n 80 /var/lib/servik/panel/storage/logs/*.log' || true
          sudo journalctl --no-pager -u servik-agent -u 'servik-update-*' -u servik-php -u servik-web -u 'servik-panel-*' -n 150 || true
          cat /tmp/release-source.log || true

  panel-realhost:
    name: Panel suspends a customer on a real server
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servik
          POSTGRES_PASSWORD: servik
          POSTGRES_DB: servik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Install Nginx and PHP-FPM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx php8.3-fpm
          sudo systemctl start nginx php8.3-fpm

      - name: Build and start the agent
        working-directory: agent
        run: |
          CGO_ENABLED=0 go build -o bin/servik-agent ./cmd/servik-agent
          sudo mkdir -p /run/servik-agent
          sudo sh -c 'nohup bin/servik-agent -socket /run/servik-agent/agent.sock > /tmp/servik-agent.log 2>&1 &'
          for i in $(seq 50); do [ -S /run/servik-agent/agent.sock ] && break; sleep 0.1; done

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Provisions a real site, gives it to a customer, fills the customer's
      # disk quota (measured by the agent) and checks new sites are refused,
      # then suspends the customer (Nginx serves the suspension page) and
      # brings them back. Root only to write into the site's home directory.
      - name: Customer, quota and suspension for real
        run: >-
          sudo env "PATH=$PATH" SERVIK_REALHOST=1 SERVIK_AGENT_SOCKET=/run/servik-agent/agent.sock
          DB_HOST=127.0.0.1 DB_PORT=5432 DB_USERNAME=servik DB_PASSWORD=servik
          php artisan test --testsuite=RealHost

      - name: Logs
        if: failure()
        run: |
          cat /tmp/servik-agent.log || true
          sudo journalctl --no-pager -u nginx -u php8.3-fpm -n 50 || true

  panel:
    name: Panel (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servik
          POSTGRES_PASSWORD: servik
          POSTGRES_DB: servik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: panel
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: servik
      DB_PASSWORD: servik
      SERVIK_AGENT_BIN: ${{ github.workspace }}/agent/bin/servik-agent
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Build agent for integration tests
        working-directory: agent
        run: CGO_ENABLED=0 go build -o bin/servik-agent ./cmd/servik-agent

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test
